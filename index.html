<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kanavu</title>
<style>
:root{--bg:#0b0a1a;--fg:#efeaff;--mu:#9a93c4;--ac:#f6c76b;--card:rgba(255,255,255,.06);--bd:rgba(255,255,255,.12);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;min-height:100%;color:var(--fg);font-family:Georgia,'Noto Serif Tamil',serif;background:radial-gradient(ellipse at 50% -10%,#2b1f5c 0,#0b0a1a 60%) fixed,var(--bg)}
main{max-width:560px;margin:0 auto;padding:36px 18px 70px;text-align:center}
.moon{width:110px;height:110px;margin:0 auto 14px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff7d6,#f6c76b 55%,#c98f2f);box-shadow:0 0 60px 18px rgba(246,199,107,.35);animation:f 6s ease-in-out infinite}
@keyframes f{50%{transform:translateY(-8px)}}
h1{font-size:3.4rem;margin:0;font-weight:400;letter-spacing:.3em;text-indent:.3em}
.tag{color:var(--mu);font-style:italic;margin:6px 0 30px}
.player{background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:22px 18px}
#now{font-size:1.3rem;margin-bottom:14px;min-height:1.6em}
#seek{width:100%;accent-color:var(--ac)}
.times{display:flex;justify-content:space-between;color:var(--mu);font-size:.8rem;margin-bottom:10px}
.ctl{display:flex;justify-content:center;align-items:center;gap:18px}
.ctl button{background:none;border:1px solid var(--bd);color:var(--fg);width:46px;height:46px;border-radius:50%;font-size:1.1rem;cursor:pointer}
.ctl #pp{width:64px;height:64px;background:var(--ac);color:#1b1304;border:0;font-size:1.5rem}
#list{margin-top:22px;text-align:left}
.row{display:flex;align-items:center;gap:12px;padding:12px 10px;border-bottom:1px solid var(--bd);cursor:pointer;border-radius:10px}
.row:hover{background:var(--card)}
.row.on{color:var(--ac)}
.row .n{width:22px;color:var(--mu);font-size:.85rem}
.row .t{flex:1}
.row .x{background:none;border:1px solid #e66;color:#e66;border-radius:6px;padding:2px 8px;cursor:pointer}
.art{width:170px;height:170px;margin:0 auto 16px;border-radius:16px;background:var(--card) center/cover;display:flex;align-items:center;justify-content:center;font-size:3rem;border:1px solid var(--bd);box-shadow:0 10px 30px rgba(0,0,0,.4)}
.th{width:44px;height:44px;border-radius:8px;background:var(--card) center/cover;flex:none;display:flex;align-items:center;justify-content:center}
.empty{color:var(--mu);text-align:center;padding:26px 0}
#admin{display:none;margin-top:30px;border:1px dashed var(--bd);border-radius:14px;padding:16px;text-align:left}
#admin input[type=text]{width:100%;box-sizing:border-box;padding:9px;margin:8px 0;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--fg)}
#admin button{background:var(--ac);color:#1b1304;border:0;border-radius:8px;padding:9px 16px;cursor:pointer;margin-top:10px}
#msg{color:var(--mu);font-size:.85rem;margin-top:8px}
</style></head>
<body><main>
<div class="moon"></div>
<h1>KANAVU</h1><p class="tag">En kanavugal, en paadalgal</p>
<div class="player">
<div class="art" id="art">🎵</div>
<div id="now">Oru song select pannunga</div>
<input type="range" id="seek" value="0" min="0" max="100" step="0.1">
<div class="times"><span id="cur">0:00</span><span id="dur">0:00</span></div>
<div class="ctl"><button id="prev">&#9198;</button><button id="pp">&#9654;</button><button id="next">&#9197;</button></div>
</div>
<div id="list"></div>
</main>
<script>
const $=id=>document.getElementById(id),audio=new Audio(),list=$('list');
let songs=[],cur=-1;
function setCover(el,s){if(s&&s.cover){el.style.backgroundImage='url("'+s.cover+'")';el.textContent='';}else{el.style.backgroundImage='';el.textContent='\u{1F3B5}';}}
const fmt=s=>isFinite(s)?Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0'):'0:00';
function render(){
  list.innerHTML='';
  if(!songs.length){list.innerHTML='<div class="empty">Songs vara poguthu\u2026</div>';return;}
  songs.forEach((s,i)=>{
    const r=document.createElement('div');r.className='row'+(i===cur?' on':'');
    const n=document.createElement('span');n.className='n';n.textContent=i+1;
    const t=document.createElement('span');t.className='t';t.textContent=s.title;
    const th=document.createElement('div');th.className='th';setCover(th,s);
    r.append(n,th,t);r.onclick=()=>load(i,true);list.append(r);
  });
}
function load(i,play){
  if(i<0||i>=songs.length)return;
  cur=i;audio.src=songs[i].file;$('now').textContent=songs[i].title;setCover($('art'),songs[i]);render();
  if(play)audio.play();
}
$('pp').onclick=()=>{if(cur<0){load(0,true);return;}audio.paused?audio.play():audio.pause();};
$('next').onclick=()=>load((cur+1)%songs.length,true);
$('prev').onclick=()=>load((cur-1+songs.length)%songs.length,true);
audio.onplay=()=>$('pp').textContent='\u23F8';
audio.onpause=()=>$('pp').textContent='\u25B6';
audio.onended=()=>{if(songs.length>1)load((cur+1)%songs.length,true);};
audio.ontimeupdate=()=>{$('cur').textContent=fmt(audio.currentTime);$('dur').textContent=fmt(audio.duration);$('seek').value=audio.duration?audio.currentTime/audio.duration*100:0;};
$('seek').oninput=e=>{if(audio.duration)audio.currentTime=e.target.value/100*audio.duration;};
fetch('songs.json').then(r=>r.json()).then(s=>{songs=s;render();}).catch(()=>{list.textContent='Songs load aagala.';});
</script></body></html>
